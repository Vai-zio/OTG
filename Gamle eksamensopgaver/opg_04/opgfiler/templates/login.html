{% extends "layout.html" %}
{% block body %}
  <h2>Login</h2>
  <form method="post">
    <label for="email">Email:</label>
    <input type="text" name="email" id="email">

    <label for="pass">Password:</label>
    <input type="password" name="pass" id="pass" size="20">

    <input class="button" type="submit" value="Login">
  </form>
{% endblock %}
